name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2019: preinstalled VS2019 + VC142 toolset (matches Qt6 msvc2019_64 ABI)
        # ubuntu-latest: GCC toolchain (matches Qt6 gcc_64 ABI)
        os: [ubuntu-latest, windows-2019]

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtwebsockets'

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebsockets'

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ lcov libssl-dev zlib1g-dev clang-tidy

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DENABLE_WARNINGS=ON \
            -DENABLE_LTO=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build `
            -G "Visual Studio 16 2019" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTS=ON `
            -DENABLE_WARNINGS=ON

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build -j$(nproc)

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        env:
          # Headless CI: force offscreen Qt platform plugin (no X server/display available)
          QT_QPA_PLATFORM: offscreen
        run: |
          cd build
          ctest --output-on-failure

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: |
          cd build
          ctest -C Release --output-on-failure

      - name: Run clang-tidy (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build-tidy \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy
          cmake --build build-tidy -j$(nproc) 2>&1 | tee clang-tidy-report.txt

      - name: Run clang-tidy (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build-tidy `
            -G "Visual Studio 16 2019" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Debug `
            -DBUILD_TESTS=ON `
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy
          cmake --build build-tidy --config Release --parallel 2 2>&1 | Tee-Object -FilePath clang-tidy-report.txt

      - name: Build with coverage
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build-coverage \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DENABLE_COVERAGE=ON
          cmake --build build-coverage -j$(nproc)

      - name: Generate coverage report
        if: runner.os == 'Linux'
        env:
          # Headless CI: force offscreen Qt platform plugin (no X server/display available)
          QT_QPA_PLATFORM: offscreen
        run: |
          cd build-coverage
          ctest --output-on-failure
          lcov --directory . --capture --output-file coverage.info 2>/dev/null || true
          lcov --remove coverage.info '/usr/*' '*build-coverage/*' '*test*' --output-file coverage.info.cleaned 2>/dev/null || true
          genhtml -o coverage_report coverage.info.cleaned 2>/dev/null || true

      - name: Upload coverage artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.os }}
          path: build-coverage/coverage_report
          retention-days: 30

      - name: Upload clang-tidy report
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-${{ matrix.os }}
          path: clang-tidy-report.txt
          retention-days: 30