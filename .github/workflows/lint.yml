name: Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  clang-tidy:
    name: Clang-Tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtwebsockets'

      - name: Install lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang-tidy

      - name: Configure with clang-tidy
        run: |
          cmake -S . -B build-lint \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy

      - name: Build with clang-tidy
        run: cmake --build build-lint -j$(nproc) 2>&1 | tee clang-tidy-report.txt

      - name: Upload clang-tidy report
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: clang-tidy-report.txt
          retention-days: 30

  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --version
          cppcheck \
            --force \
            --enable=all \
            --std=c++17 \
            --platform=linux \
            -I include \
            -I include/soul \
            src/ \
            tests/ \
            2>&1 | tee cppcheck-report.txt

      - name: Upload cppcheck report
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck-report.txt
          retention-days: 30