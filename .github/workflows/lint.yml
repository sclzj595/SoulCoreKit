name: Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  clang-tidy:
    name: Clang-Tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtwebsockets'

      - name: Install lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang-tidy

      - name: Configure with clang-tidy
        run: |
          cmake -S . -B build-lint \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy

      - name: Build with clang-tidy
        run: cmake --build build-lint -j$(nproc) 2>&1 | tee clang-tidy-report.txt

      - name: "Check clang-tidy errors (v1.9.1 CI强制闭环)"
        run: |
          set -euo pipefail
          error_count=$(grep -c "error:" clang-tidy-report.txt || true)
          if [ "$error_count" -gt 0 ]; then
            echo "::error::Found $error_count clang-tidy error(s)"
            grep "error:" clang-tidy-report.txt | head -20
            echo ""
            echo "ERROR: clang-tidy found $error_count error-level issues."
            echo "Fix all clang-tidy errors before merging."
            exit 1
          fi
          # 统计 warning 数量(仅作信息输出,不阻断)
          warn_count=$(grep -c "warning:" clang-tidy-report.txt || true)
          echo "Clang-Tidy: 0 errors, $warn_count warning(s)"
          echo "Clang-Tidy CI check passed."

      - name: Upload clang-tidy report
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: clang-tidy-report.txt
          retention-days: 30

  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --version
          cppcheck \
            --force \
            --enable=all \
            --std=c++17 \
            --platform=linux \
            -I include \
            -I include/soul \
            src/ \
            tests/ \
            2>&1 | tee cppcheck-report.txt

      - name: Upload cppcheck report
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck-report.txt
          retention-days: 30

  # Regression guard: enforce that every blanket catch (...) carries a
  # justification comment (// Blanket catch: <reason>) in its surrounding
  # lines. Prevents silent exception swallowing from sneaking back in.
  # See docs/v1.7.0/01_stabilization.md §3.1 item 6.
  blanket-catch-guard:
    name: Blanket-Catch Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check blanket catches have justification
        run: |
          set -euo pipefail
          errors=0
          while IFS=: read -r file lineno _; do
            if ! sed -n "$((lineno-1)),$((lineno+2))p" "$file" | grep -q "Blanket catch:"; then
              echo "::error file=$file,line=$lineno::Blanket catch without justification comment"
              echo "  -> $file:$lineno"
              errors=$((errors+1))
            fi
          done < <(grep -rn "catch\s*(\s*\.\.\.\s*)" src/ tests/ || true)
          if [ "$errors" -gt 0 ]; then
            echo "ERROR: Found $errors blanket catch(es) without justification."
            echo "Add '// Blanket catch: <reason>' on a line adjacent to catch (...)."
            exit 1
          fi
          echo "OK: All blanket catches are justified."